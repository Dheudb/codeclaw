name: Desktop workbench
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  engine:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.python == '3.9'
        run: python -m pip install -e .
      - if: matrix.python != '3.9'
        run: python -m pip install -e ".[mcp]"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "..[mcp]"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:sessions
      - run: npm run test:mcp
        env:
          CODECLAW_PYTHON: python
      - run: npm run pack
        env:
          CODECLAW_BUILD_PYTHON: python
      - run: npm run test:mcp
        env:
          CODECLAW_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\CodeClaw-win32-x64\CodeClaw.exe
      - run: npm run test:sessions
        env:
          CODECLAW_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\CodeClaw-win32-x64\CodeClaw.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CodeClaw-Windows-x64
          path: desktop/release/CodeClaw-win32-x64/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: desktop/test-results/*.png
