name: Desktop workbench
permissions:
  contents: read
on:
  # Manual runs only while the account billing lock blocks hosted runners.
  # Keep local validation available without repeated failure emails on pushes.
  workflow_dispatch:
jobs:
  engine:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.python == '3.9'
        run: python -m pip install -e ".[dev]"
      - if: matrix.python != '3.9'
        run: python -m pip install -e ".[mcp,dev]"
      - run: python scripts/check-python-names.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "..[mcp]"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:sessions
      - run: npm run test:draft-exit
      - run: npm run test:preferences
      - run: npm run test:shutdown
      - run: npm run test:goals
      - run: npm run test:workspace
      - run: npm run test:archives
      - run: npm run test:models
      - run: npm run test:permissions
      - run: npm run test:subagents
      - run: npm run test:composer
      - run: npm run test:message-actions
      - run: npm run test:collaboration
      - run: npm run test:activity
      - run: npm run test:scroll-layout
      - run: npm run test:tool-recovery
      - run: npm run test:subagent-completion
      - run: npm run test:streaming
      - run: npm run test:subagents
        env:
          XULOOM_TEST_DSML: '1'
      - run: npm run test:permissions
        env:
          XULOOM_TEST_DSML: '1'
      - run: npm run test:mcp
        env:
          XULOOM_PYTHON: python
      - run: npm run pack
        env:
          XULOOM_BUILD_PYTHON: python
      - run: npm run test:mcp
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:sessions
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:workspace
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:draft-exit
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:preferences
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:shutdown
      - run: npm run test:goals
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:archives
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:models
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:permissions
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:subagents
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:activity
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - run: npm run test:streaming
        env:
          XULOOM_TEST_EXECUTABLE: ${{ github.workspace }}\desktop\release\Xuloom-win32-x64\Xuloom.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Xuloom-Windows-x64
          path: desktop/release/Xuloom-win32-x64/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: desktop/test-results/*.png
